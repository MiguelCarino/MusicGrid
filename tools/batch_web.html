<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicGrid — Batch Add</title>
<style>
  :root { --bg:#050505; --card:#0d0d0d; --border:#262626; --dim:#52525b; --gold:#eab308; --bright:#fbbf24; --red:#ef4444; --green:#22c55e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:#d4d4d8; font-family:system-ui,sans-serif; padding:20px; max-width:1100px; margin:0 auto; }
  h1 { font-size:1.15rem; color:var(--gold); letter-spacing:.05em; margin-bottom:2px; }
  .sub { font-family:monospace; font-size:.7rem; color:var(--dim); margin-bottom:18px; }
  section { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:14px; }
  section h2 { font-size:.72rem; text-transform:uppercase; letter-spacing:.15em; color:var(--dim); margin-bottom:10px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text], select, textarea { background:#111; border:1px solid var(--border); border-radius:6px; color:#fff; padding:8px 10px; font-size:.85rem; outline:none; }
  input[type=text]:focus, select:focus, textarea:focus { border-color:var(--gold); }
  textarea { font-family:monospace; font-size:.78rem; resize:vertical; width:100%; }
  button { background:transparent; border:1px solid var(--border); color:#d4d4d8; padding:8px 14px; border-radius:6px; cursor:pointer; font-size:.8rem; letter-spacing:.04em; transition:.15s; }
  button:hover { border-color:var(--gold); color:var(--gold); }
  button.primary { border-color:var(--gold); color:var(--gold); }
  button.primary:hover { background:rgba(234,179,8,.1); }
  button:disabled { opacity:.35; cursor:default; border-color:var(--border); color:#d4d4d8; background:none; }
  label { font-size:.78rem; color:#a1a1aa; display:flex; align-items:center; gap:6px; }
  .field { display:flex; flex-direction:column; gap:4px; }
  .field > span { font-size:.65rem; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); }
  a { color:var(--gold); }
  .spacer { flex:1; }

  #bar { height:6px; background:#111; border-radius:3px; overflow:hidden; margin-top:12px; display:none; }
  #bar div { height:100%; width:0; background:var(--gold); transition:width .3s; }
  #log { font-family:monospace; font-size:.7rem; color:var(--dim); white-space:pre-wrap; max-height:130px; overflow:auto; margin-top:8px; display:none; }

  .counts { font-size:.8rem; }
  .counts b.ok { color:var(--green); } .counts b.bad { color:var(--red); }
  #list { display:flex; flex-direction:column; gap:8px; margin-top:12px; }
  .song { display:grid; grid-template-columns:88px 1fr auto; gap:12px; background:#111; border:1px solid var(--border); border-left:3px solid var(--red); border-radius:8px; padding:10px; }
  .song.ready { border-left-color:var(--green); }
  .song img { width:88px; height:88px; border-radius:6px; object-fit:cover; background:#1a1a1a; }
  .song .main { display:flex; flex-direction:column; gap:6px; min-width:0; }
  .song .tag { width:100%; }
  .song select { padding:5px 8px; font-size:.8rem; }
  .song select.bad, .song input.bad { border-color:var(--red); color:var(--red); }
  .song .meta { color:var(--dim); font-size:.7rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .song .check { color:var(--bright); font-size:.72rem; }
  .song .side { display:flex; flex-direction:column; gap:6px; align-items:stretch; }
  .song .side button { padding:5px 10px; font-size:.75rem; }
  .empty { color:var(--dim); font-size:.8rem; padding:10px 0; }
  #out { font-family:monospace; font-size:.72rem; white-space:pre-wrap; word-break:break-all; background:#111; border:1px solid var(--green); border-radius:8px; padding:10px; margin-top:10px; display:none; max-height:220px; overflow:auto; }
  #out.err { border-color:var(--red); }
  @media (max-width:600px) { .song { grid-template-columns:64px 1fr; } .song img { width:64px; height:64px; } .song .side { grid-column:1 / -1; flex-direction:row; } }
</style>
</head>
<body>
<h1>MusicGrid — Batch Add</h1>
<div class="sub"><span id="stateLine">loading…</span> · <a href="/">one song at a time →</a></div>

<section>
  <h2>1 · Paste songs</h2>
  <textarea id="items" rows="6" placeholder="One per line: a YouTube link, a video id, a playlist link, or plain search terms like &quot;ABBA Dancing Queen&quot;"></textarea>
  <div class="row" style="margin-top:10px; align-items:flex-end">
    <div class="field"><span>country</span><select id="dCountry"></select></div>
    <div class="field"><span>genre</span><select id="dGenre"></select></div>
    <div class="field"><span>mood</span><select id="dMood"></select></div>
    <label><input type="checkbox" id="dCarino" checked> carino list</label>
    <label><input type="checkbox" id="dLyrics" checked> synced lyrics</label>
    <div class="spacer"></div>
    <button id="btnStop" disabled>Stop</button>
    <button class="primary" id="btnFetch">Fetch</button>
  </div>
  <div id="bar"><div></div></div>
  <div id="log"></div>
</section>

<section>
  <h2>2 · Check and write</h2>
  <div class="row">
    <span class="counts" id="counts"></span>
    <label><input type="checkbox" id="onlyBad"> only show songs that need a hand</label>
    <div class="spacer"></div>
    <select id="bulkMood"></select>
    <button id="btnBulkMood">Set mood on songs without one</button>
  </div>
  <div id="list"></div>
  <div class="row" style="margin-top:12px">
    <div class="spacer"></div>
    <button class="primary" id="btnCommit" disabled>Write ready songs</button>
  </div>
  <div id="out"></div>
</section>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = null, polling = null;

const post = async (path, body) => {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(body || {}) });
  return r.json();
};

function options(reg, iconKey, value, blank) {
  const keys = Object.keys(reg).sort();
  let html = blank ? `<option value="">${blank}</option>` : "";
  if (!blank && !(value in reg)) html += `<option value="?" selected>? choose</option>`;
  return html + keys.map(k => `<option value="${k}"${k === value ? " selected" : ""}>`
    + `${reg[k][iconKey] || ""} ${esc(reg[k].name || k)}</option>`).join("");
}

function fillDefaults() {
  if ($("dCountry").options.length) return;
  $("dCountry").innerHTML = options(state.countries, "flag", "", "auto (artist's country)");
  $("dGenre").innerHTML = options(state.genres, "icon", "", "auto (from iTunes)");
  $("dMood").innerHTML = options(state.moods, "icon", "", "ask me after");
  $("bulkMood").innerHTML = options(state.moods, "icon", Object.keys(state.moods).sort()[0]);
}

function songRow(e) {
  const bad = new Set(e._problems);
  const cover = e.image?.startsWith("inbox:") ? `/inbox/${e.image.slice(6)}.webp`
              : e.image && e.image !== "?" ? `/covers/${e.image}` : "";
  const sel = (field, reg, icon) =>
    `<select data-f="${field}" class="${bad.has(field) ? "bad" : ""}">${options(reg, icon, e[field])}</select>`;
  const notes = [...e._problems.filter(p => ["image", "duplicate"].includes(p))
                   .map(p => p === "image" ? "no cover" : "already in the catalog"),
                 ...(e._check || [])];
  return `
    ${cover ? `<img src="${cover}" alt="">` : `<img alt="">`}
    <div class="main">
      <input type="text" class="tag ${bad.has("tag") ? "bad" : ""}" data-f="tag" value="${esc(e.tag)}" placeholder="Artist — Title">
      <div class="row">
        ${sel("country", state.countries, "flag")}
        ${sel("genre", state.genres, "icon")}
        ${sel("mood", state.moods, "icon")}
        <label><input type="checkbox" data-f="carino"${e.carino ? " checked" : ""}> carino</label>
        ${e._lyrics ? `<span class="meta">♪ lyrics</span>` : ""}
      </div>
      <div class="meta" title="${esc(e._video)}">▶ ${esc(e._video)}</div>
      ${e._itunes ? `<div class="meta" title="${esc(e._itunes)}">iTunes: ${esc(e._itunes)}</div>` : ""}
      ${notes.map(n => `<div class="check">⚠ ${esc(n)}</div>`).join("")}
    </div>
    <div class="side">
      <button data-act="play">▶ YouTube</button>
      ${e.applemusicurl ? `<button data-act="apple">Apple</button>` : ""}
      <button data-act="delete">✕ Remove</button>
    </div>`;
}

function render() {
  const entries = state.entries;
  const ready = entries.filter(e => !e._problems.length).length;
  $("stateLine").textContent = `${state.count} songs in the catalog · ${entries.length} in the inbox`;
  $("counts").innerHTML = entries.length
    ? `<b class="ok">${ready} ready</b> · <b class="bad">${entries.length - ready} need a hand</b>` : "";
  $("btnCommit").disabled = !ready || state.job.running;
  $("btnCommit").textContent = ready ? `Write ${ready} ready song${ready > 1 ? "s" : ""}` : "Write ready songs";

  const list = $("list");
  const shown = entries.filter(e => !$("onlyBad").checked || e._problems.length);
  const keep = new Set(shown.map(e => e.url));
  [...list.children].forEach(el => { if (!keep.has(el.dataset.url)) el.remove(); });
  let prev = null;
  for (const e of shown) {
    const sig = JSON.stringify(e);
    let el = list.querySelector(`.song[data-url="${CSS.escape(e.url)}"]`);
    if (!el) {
      el = document.createElement("div");
      el.className = "song";
      el.dataset.url = e.url;
    }
    // never rebuild the row you're typing in
    if (el.dataset.sig !== sig && !el.contains(document.activeElement)) {
      el.innerHTML = songRow(e);
      el.dataset.sig = sig;
    }
    el.classList.toggle("ready", !e._problems.length);
    const want = prev ? prev.nextSibling : list.firstChild;
    if (want !== el) list.insertBefore(el, want);
    prev = el;
  }
  if (!entries.length) list.innerHTML = `<div class="empty">The inbox is empty. Paste some songs above and press Fetch.</div>`;
  else list.querySelector(".empty")?.remove();

  const j = state.job;
  $("btnFetch").disabled = j.running;
  $("btnStop").disabled = !j.running;
  if (j.running || j.log.length) {
    $("bar").style.display = "block";
    $("log").style.display = "block";
    const pct = j.running ? Math.min(100, 100 * j.done / Math.max(1, j.total)) : 100;
    $("bar").firstElementChild.style.width = pct + "%";
    const atBottom = $("log").scrollTop + $("log").clientHeight >= $("log").scrollHeight - 4;
    $("log").textContent = j.log.join("\n");
    if (atBottom) $("log").scrollTop = $("log").scrollHeight;
  }
}

async function refresh() {
  state = await (await fetch("/api/batch")).json();
  fillDefaults();
  render();
  if (state.job.running && !polling) polling = setInterval(refresh, 1500);
  if (!state.job.running && polling) { clearInterval(polling); polling = null; }
}

const update = (urls, body) => post("/api/batch/update", { urls, ...body }).then(refresh);

$("list").addEventListener("change", ev => {
  const f = ev.target.dataset.f, row = ev.target.closest(".song");
  if (!f || !row) return;
  const v = ev.target.type === "checkbox" ? ev.target.checked : ev.target.value;
  ev.target.blur();
  update([row.dataset.url], { set: { [f]: v } });
});
$("list").addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.dataset.f === "tag") ev.target.blur();
});
$("list").addEventListener("click", ev => {
  const act = ev.target.dataset.act, row = ev.target.closest(".song");
  if (!act || !row) return;
  const e = state.entries.find(x => x.url === row.dataset.url);
  if (act === "play") window.open(`https://www.youtube.com/watch?v=${e.url}`, "_blank");
  if (act === "apple") window.open("https://music.apple.com/" + e.applemusicurl, "_blank");
  if (act === "delete") update([e.url], { delete: true });
});

$("btnFetch").onclick = async () => {
  const items = $("items").value.split("\n").map(s => s.trim()).filter(Boolean);
  if (!items.length) return $("items").focus();
  const d = await post("/api/batch/fetch", {
    items, country: $("dCountry").value, genre: $("dGenre").value, mood: $("dMood").value,
    carino: $("dCarino").checked, lyrics: $("dLyrics").checked });
  if (d.error) return showOut(d.error, true);
  $("items").value = "";
  refresh();
};
$("btnStop").onclick = () => post("/api/batch/stop").then(refresh);
$("onlyBad").onchange = render;

$("btnBulkMood").onclick = () => {
  const urls = state.entries.filter(e => !(e.mood in state.moods)).map(e => e.url);
  if (urls.length) update(urls, { set: { mood: $("bulkMood").value } });
};

function showOut(text, err) {
  $("out").style.display = "block";
  $("out").className = err ? "err" : "";
  $("out").textContent = text;
}

$("btnCommit").onclick = async () => {
  $("btnCommit").disabled = true;
  const d = await post("/api/batch/commit");
  if (d.error) showOut("✗ " + d.error, true);
  else showOut(`✓ wrote ${d.done} song${d.done === 1 ? "" : "s"} to the catalog`
    + (d.left ? ` · ${d.left} still in the inbox` : "")
    + `\n\n${d.lines.join("\n")}\n\nCheck with git diff, then commit when happy.`);
  refresh();
};

refresh();
</script>
</body>
</html>
